# --- Display (nice!view) ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_SPI=y

# --- Battery reporting (each half can report its own battery) ---
CONFIG_ZMK_BATTERY=y
CONFIG_BT_BAS=y
CONFIG_ADC=y

# --- BLE + split ---
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_PERIPHERAL=y

# Peripherals don’t manage multiple host profiles
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_MAX_CONN=1

# Optional
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_MOUSE=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_INF=y
