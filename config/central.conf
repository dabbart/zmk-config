# --- Display (nice!view) ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_SPI=y                 # nice!view is SPI

# --- Battery reporting (fixes 0%) ---
CONFIG_ZMK_BATTERY=y
CONFIG_BT_BAS=y
CONFIG_ADC=y

# --- BLE + split ---
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Reasonable central BLE profile counts
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_MAX_CONN=6

# Optional quality-of-life
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y       # power switch for the display, if wired via adapter
CONFIG_ZMK_MOUSE=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y   # helps if you need to capture logs
